name: Bug report
description: Report a problem with the Philips AirPurifier (CoAP) integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail
        as possible so the issue can be reproduced.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest version of the integration.
          required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: e.g. 0.37.0
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.6.0
    validations:
      required: true
  - type: input
    id: device_model
    attributes:
      label: Device model
      description: The Philips model number.
      placeholder: e.g. AC2889, AMF870, CX5120
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A clear description of the bug and the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / diagnostics
      description: >-
        Enable debug logging for the integration and paste the output. If
        possible, download diagnostics from the device page and attach them.
      render: shell
    validations:
      required: false
