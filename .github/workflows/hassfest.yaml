name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      # Use the fork that tolerates the bundled custom `pap:` icon set: the
      # official hassfest rejects any icon in icons.json that is not an `mdi:`
      # Material Design Icon, which would fail this integration's custom icons.
      - uses: kongo09/actions/hassfest@master
